# Publica uma versão nova do Parallello sozinho.
# Quando uma tag "v1.0.1" (por exemplo) chega no GitHub, este roteiro roda num
# Windows do próprio GitHub: confere o código, gera o instalador e cria o Release.
# Os Parallello instalados encontram o Release e se atualizam sozinhos.
name: Publicar versão

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Conferir o código
        run: |
          npm run typecheck
          npm test

      - name: Gerar instalador e publicar o Release
        run: node scripts/build.mjs && npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Instalador do Parallello (o .exe que pede a senha do administrador e baixa a versão mais recente).
      # Vai junto em todo Release, então o link abaixo sempre funciona:
      # https://github.com/ramonbfpatrimonio/Parallello/releases/latest/download/Instalador-Parallello.exe
      - name: Anexar o Instalador do Parallello ao Release
        shell: pwsh
        run: |
          npm run instalador
          $versao = node -p "require('./package.json').version"
          gh release upload "v$versao" dist-instalador/Instalador-Parallello.exe --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
