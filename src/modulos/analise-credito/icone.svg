<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="ac-fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="ac-sombra" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#7c2d12" flood-opacity=".28"/>
    </filter>
  </defs>
  <!-- fundo -->
  <rect width="512" height="512" rx="112" fill="url(#ac-fundo)"/>
  <!-- medidor de score (3 faixas: risco, regular, bom) -->
  <g fill="none" stroke="#fff" stroke-width="46">
    <path d="M 98 300 A 140 140 0 0 1 154.8 187.4" stroke-opacity=".42"/>
    <path d="M 162.6 181.9 A 140 140 0 0 1 297.4 174.2" stroke-opacity=".7"/>
    <path d="M 306 178.8 A 140 140 0 0 1 378 300"/>
  </g>
  <!-- ponteiro -->
  <line x1="238" y1="300" x2="318" y2="234" stroke="#fff" stroke-width="20" stroke-linecap="round"/>
  <circle cx="238" cy="300" r="28" fill="#fff"/>
  <circle cx="238" cy="300" r="11" fill="#ea580c"/>
  <!-- linhas de dados -->
  <rect x="108" y="356" width="196" height="24" rx="12" fill="#fff" fill-opacity=".92"/>
  <rect x="108" y="396" width="128" height="24" rx="12" fill="#fff" fill-opacity=".6"/>
  <!-- selo de aprovado -->
  <g filter="url(#ac-sombra)">
    <circle cx="390" cy="390" r="76" fill="#fff"/>
  </g>
  <path d="M 352 392 L 379 419 L 430 366" fill="none" stroke="#16a34a" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
